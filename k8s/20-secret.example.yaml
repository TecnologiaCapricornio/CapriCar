# MODELO - não é pra aplicar direto. Copie para 20-secret.yaml, preenche os
# valores reais e NÃO comita esse arquivo preenchido no Git (adicione
# "k8s/20-secret.yaml" ao .gitignore).
#
# Gera os valores em base64 com: echo -n 'valor' | base64
# (no Linux/Mac/WSL) ou no PowerShell:
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('valor'))
#
# Alternativa mais segura, sem deixar nada em base64 num arquivo: usar o
# Azure Key Vault + o provider CSI de segredos do AKS, ou criar o Secret
# direto por linha de comando (kubectl create secret generic ... substitui
# este arquivo inteiro):
#   kubectl create secret generic capricar-secrets -n capricar \
#     --from-literal=PGPASSWORD='...' \
#     --from-literal=ADMIN_INITIAL_PASSWORD='...' \
#     --from-literal=SETTINGS_ENCRYPTION_KEY='...' \
#     --from-literal=BACKUP_ENCRYPTION_KEY='...'
apiVersion: v1
kind: Secret
metadata:
  name: capricar-secrets
  namespace: capricar
type: Opaque
data:
  # Senha do usuário capricar_app no Flexible Server.
  PGPASSWORD: BASE64_AQUI

  # Só é lida na primeira carga de um banco vazio - como você já restaurou os
  # dados antigos, pode deixar em branco (remova a linha) ou qualquer valor.
  ADMIN_INITIAL_PASSWORD: BASE64_AQUI

  # Necessária para o Painel de Administração conseguir salvar/ler as
  # credenciais do Entra ID e do SMTP guardadas no banco (já devem existir
  # cifradas lá desde a migração - se você não sabe qual chave foi usada
  # originalmente, veja o valor de SETTINGS_ENCRYPTION_KEY no seu .env local
  # atual e copie o mesmo valor, senão o app não consegue decifrar o que já
  # está salvo no banco).
  SETTINGS_ENCRYPTION_KEY: BASE64_AQUI

  # Opcional - só necessária se você usa BACKUP_ENCRYPTION_KEY localmente e
  # quer manter a mesma chave em produção.
  # BACKUP_ENCRYPTION_KEY: BASE64_AQUI
