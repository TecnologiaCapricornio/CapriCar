# Variáveis NÃO sensíveis (equivalente à parte "pública" do .env).
# As sensíveis (senhas, chaves) ficam no Secret (20-secret.example.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: capricar-config
  namespace: capricar
data:
  PORT: "3000"
  NODE_ENV: "production"

  # Dentro do container a aplicação precisa escutar em todas as interfaces,
  # não só no loopback - ver server/config.js (mesmo motivo do HOST=0.0.0.0
  # usado no docker-compose.yml).
  HOST: "0.0.0.0"

  # Substitua pelo endereço do seu Azure Database for PostgreSQL - Flexible
  # Server (algo como "capricar-db.postgres.database.azure.com").
  PGHOST: "SUBSTITUA-pelo-endereco-do-flexible-server"
  PGPORT: "5432"
  PGDATABASE: "capricar"
  PGUSER: "capricar_app"

  SESSION_TTL_HOURS: "12"
  # Vai atrás de HTTPS (o Ingress cuida disso) - deixe true em produção.
  SESSION_COOKIE_SECURE: "true"

  BACKUP_DIR: "backups"
  BACKUP_RETENTION_DAYS: "30"

  # "local", "entra" ou "both". A configuração do Entra ID em si já foi
  # migrada junto com o banco (fica salva na tabela application_state,
  # não em variável de ambiente) - não precisa preencher ENTRA_* aqui.
  LOGIN_METHOD: "both"
