name: capricar

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Banco volta a ser o Postgres instalado direto na máquina (fora do
      # Docker) - "host.docker.internal" é o nome especial que o Docker
      # Desktop resolve pro IP do host visto de dentro do container (não dá
      # pra usar "localhost" aqui, porque dentro do container isso apontaria
      # pro próprio container, não pra sua máquina). PGPORT volta a ser a
      # porta padrão (5432), já que não tem mais nenhum Postgres do Docker
      # competindo por ela.
      PGHOST: host.docker.internal
      PGPORT: 5432
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      # Fotos de CNH e de retirada/devolução (ver server/photo-storage.js) -
      # sem isso, elas somem toda vez que o container é recriado.
      - capricar_uploads:/app/server/uploads
      - capricar_backups:/app/backups
    # "extra_hosts" garante que "host.docker.internal" resolva mesmo fora do
    # Docker Desktop (em Linux puro ele não vem configurado por padrão; no
    # Windows/Mac já funciona sozinho, mas não tem problema deixar aqui).
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  capricar_uploads:
  capricar_backups:
