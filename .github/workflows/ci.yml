name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas da mesma branch quando um push novo chega.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    name: Lint e testes
    runs-on: ubuntu-latest

    env:
      # Valores descartáveis, válidos apenas dentro do job. A suíte principal
      # não acessa banco - só `npm run test:integration` acessa, e ele roda no
      # job separado abaixo.
      NODE_ENV: test
      SETTINGS_ENCRYPTION_KEY: ci-only-disposable-passphrase
      SESSION_COOKIE_SECURE: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Testes
        run: pnpm test

      - name: Conferir numeração das migrations
        # Migration duplicada ou fora de ordem quebra o deploy silenciosamente:
        # o runner aplica por ordem de nome, então dois arquivos com o mesmo
        # prefixo tornam a ordem dependente do sistema de arquivos.
        run: node scripts/check-migrations.js

  integracao:
    name: Integração com PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: capricar_ci
          POSTGRES_USER: capricar
          POSTGRES_PASSWORD: capricar-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capricar -d capricar_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      SETTINGS_ENCRYPTION_KEY: ci-only-disposable-passphrase
      SESSION_COOKIE_SECURE: 'false'
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: capricar
      PGPASSWORD: capricar-ci-only
      PGDATABASE: capricar_ci
      CAPRICAR_TEST_ADMIN_PASSWORD: ci-only-admin-password

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Aplicar migrations
        run: pnpm run db:migrate

      - name: Testes de integração
        run: pnpm run test:integration
